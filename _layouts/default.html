---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js" data-theme="dark">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>
    <video class="site-background-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="{{ base_path }}/images/ocean-background.mp4" type="video/mp4">
    </video>
    <div class="site-background-overlay" aria-hidden="true"></div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="site-content">
      {{ content }}
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    <button class="paper-push-back-to-top" type="button" data-paper-back-to-top hidden aria-label="回到顶部 / Back to top" title="回到顶部 / Back to top">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 4h14M6 13l6-6 6 6M12 7v13"/>
      </svg>
    </button>

    {% include scripts.html %}

  </body>
</html>
